name: sthitaprajna
description: "Sthitaprajna - Stoic Executive Shield for workplace toxicity and acute anxiety."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  record: ^7.1.2
  camera: ^0.12.1
  path_provider: ^2.1.6
  webview_flutter: ^4.14.1
  youtube_player_flutter: ^10.0.1
  receive_sharing_intent: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - notifications_dataset.json
    - assets/data/wisdom_vault.json
