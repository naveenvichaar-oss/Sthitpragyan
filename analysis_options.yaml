analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - avoid_print
    - prefer_final_fields
    - unnecessary_string_interpolations
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_iterable_whereType
    - annotate_overrides
    - empty_constructor_bodies
